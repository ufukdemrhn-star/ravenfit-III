<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E63946">
  <link rel="manifest" href="manifest.json">
  <title>RavenFit3 — İskelet</title>
  <style>
    :root{ --bg:#0d0d0f; --card:#17171c; --line:#2a2a31; --accent:#E63946; --text:#f1f1f3; --muted:#8a8a93; }
    *{ box-sizing:border-box; }
    body{ margin:0 auto; max-width:480px; padding:20px; font-family:system-ui,-apple-system,sans-serif;
          background:var(--bg); color:var(--text); }
    h1{ font-size:20px; margin:0 0 2px; }
    .tag{ color:var(--muted); font-size:13px; margin:0 0 6px; }
    .muted{ color:var(--muted); }
    .card{ background:var(--card); border-radius:14px; padding:16px; margin:14px 0; }
    .lbl{ font-size:13px; color:var(--muted); margin:12px 0 6px; }
    label{ display:block; font-size:13px; color:var(--muted); margin:8px 0 4px; }
    input{ width:100%; padding:10px; border-radius:8px; border:1px solid var(--line);
           background:#0f0f13; color:var(--text); font-size:15px; }
    .row{ display:flex; gap:10px; } .row>div{ flex:1; }
    .pills{ display:flex; flex-wrap:wrap; gap:8px; }
    button{ -webkit-appearance:none; appearance:none;
            background:#23232b; color:var(--text); border:1px solid var(--line); border-radius:8px;
            padding:10px 12px; font-size:14px; font-family:inherit; cursor:pointer;
            transition:background .15s, border-color .15s; }
    .pills button{ flex:1 1 auto; }
    button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
    .go{ width:100%; font-size:15px; font-weight:600; margin-top:14px; }
    #out .grp{ padding:10px 0; border-bottom:1px solid var(--line); line-height:1.8; }
    #out .grp:last-child{ border-bottom:none; }
    #out .h{ font-size:11px; letter-spacing:.08em; color:var(--accent); margin-bottom:4px; }
    #out .warn{ background:#2a1e0f; color:#fbbf24; border:1px solid #5a4516; border-radius:8px;
                padding:10px; margin-top:10px; font-size:13px; line-height:1.6; }
    #out .warn.reds{ background:#2a0f12; color:#fca5a5; border-color:#5a1620; }
    #out .warn strong{ color:inherit; }
    .status{ font-size:13px; padding:8px 12px; border-radius:8px; margin:6px 0; background:#1f1f26; color:var(--muted); }
    .status.ok{ background:#0f2a1e; color:#4ade80; }
    .status.bad{ background:#2a0f12; color:#f87171; }
  </style>
</head>
<body>
  <h1>RavenFit3 🛠️ İskelet</h1>
  <p class="tag">Modüller + delegasyon + enerji/makro motoru + öneri & uyarılar + PWA</p>

  <div class="card">
    <div id="selftest" class="status">Öz-test çalışıyor…</div>
    <div id="pwa" class="status">Service worker kontrol ediliyor…</div>
  </div>

  <div class="card">
    <div class="lbl">Cinsiyet</div>
    <div class="pills">
      <button data-action="setGender" data-arg="male">Erkek</button>
      <button data-action="setGender" data-arg="female">Kadın</button>
    </div>

    <div class="row">
      <div><label>Boy (cm)</label><input id="in-height" type="number" value="180"></div>
      <div><label>Kilo (kg)</label><input id="in-weight" type="number" value="80"></div>
    </div>
    <div class="row">
      <div><label>Boyun (cm)</label><input id="in-neck" type="number" value="40"></div>
      <div><label>Bel (cm)</label><input id="in-waist" type="number" value="85"></div>
    </div>
    <label>Kalça (cm — kadın için)</label>
    <input id="in-hip" type="number" value="95">

    <div class="lbl">Aktivite düzeyi</div>
    <div class="pills">
      <button data-action="setAct" data-arg="1.2">Sedanter</button>
      <button data-action="setAct" data-arg="1.375">Az</button>
      <button data-action="setAct" data-arg="1.55">Orta</button>
      <button data-action="setAct" data-arg="1.725">Çok</button>
      <button data-action="setAct" data-arg="1.9">Aşırı</button>
    </div>

    <div class="lbl">Antrenman geçmişi</div>
    <div class="pills">
      <button data-action="setTrain" data-arg="beginner">Yeni</button>
      <button data-action="setTrain" data-arg="intermediate">Orta</button>
      <button data-action="setTrain" data-arg="advanced">İleri</button>
    </div>

    <div class="lbl">Hedef</div>
    <div class="pills">
      <button data-action="setGoal" data-arg="cut">Cut</button>
      <button data-action="setGoal" data-arg="recomp">Recomp</button>
      <button data-action="setGoal" data-arg="maintain">Koru</button>
      <button data-action="setGoal" data-arg="bulk">Bulk</button>
    </div>

    <button class="go" data-action="calculate">Hesapla</button>
  </div>

  <div class="card">
    <div id="out" class="muted">Sonuçlar burada görünecek. Seçimleri yap, "Hesapla"ya bas.</div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
