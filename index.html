<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E63946">
  <link rel="manifest" href="manifest.json">
  <title>RavenFit3 — İskelet</title>
  <style>
    /* Bu CSS kasıtlı olarak minimal. Senin 6 temalı gerçek tasarımın
       sonraki fazda style.css'e taşınacak. Burada sadece okunabilirlik var. */
    :root{ --bg:#0d0d0f; --card:#17171c; --line:#2a2a31; --accent:#E63946; --text:#f1f1f3; --muted:#8a8a93; }
    *{ box-sizing:border-box; }
    body{ margin:0 auto; max-width:480px; padding:20px; font-family:system-ui,-apple-system,sans-serif;
          background:var(--bg); color:var(--text); }
    h1{ font-size:20px; margin:0 0 2px; }
    .tag{ color:var(--muted); font-size:13px; margin:0 0 6px; }
    .muted{ color:var(--muted); }
    .card{ background:var(--card); border-radius:14px; padding:16px; margin:14px 0; }
    label{ display:block; font-size:13px; color:var(--muted); margin:8px 0 4px; }
    input{ width:100%; padding:10px; border-radius:8px; border:1px solid var(--line);
           background:#0f0f13; color:var(--text); font-size:15px; }
    .row{ display:flex; gap:10px; } .row>div{ flex:1; }
    /* -webkit-appearance:none → iOS Safari'nin native buton görünümünü kapatır,
       böylece .on kırmızı arka planı GERÇEKTEN görünür. */
    button{ -webkit-appearance:none; appearance:none;
            background:#23232b; color:var(--text); border:1px solid var(--line); border-radius:8px;
            padding:10px 14px; font-size:15px; font-family:inherit; cursor:pointer; width:100%;
            transition:background .15s, border-color .15s; }
    button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
    .go{ background:var(--accent); border-color:var(--accent); font-weight:600; margin-top:14px; }
    #out{ line-height:1.8; }
    .status{ font-size:13px; padding:8px 12px; border-radius:8px; margin:6px 0; background:#1f1f26; color:var(--muted); }
    .status.ok{ background:#0f2a1e; color:#4ade80; }
    .status.bad{ background:#2a0f12; color:#f87171; }
  </style>
</head>
<body>
  <h1>RavenFit3 🛠️ Çalışan İskelet</h1>
  <p class="tag">ES modüller + olay delegasyonu + öz-test + PWA — mimari kanıtı</p>

  <div class="card">
    <div id="selftest" class="status">Öz-test çalışıyor…</div>
    <div id="pwa" class="status">Service worker kontrol ediliyor…</div>
  </div>

  <div class="card">
    <label>Cinsiyet</label>
    <div class="row">
      <div><button data-action="setGender" data-arg="male">Erkek</button></div>
      <div><button data-action="setGender" data-arg="female">Kadın</button></div>
    </div>
    <div class="row">
      <div><label>Boy (cm)</label><input id="in-height" type="number" value="180"></div>
      <div><label>Kilo (kg)</label><input id="in-weight" type="number" value="80"></div>
    </div>
    <div class="row">
      <div><label>Boyun (cm)</label><input id="in-neck" type="number" value="40"></div>
      <div><label>Bel (cm)</label><input id="in-waist" type="number" value="85"></div>
    </div>
    <label>Kalça (cm — kadın hesabı için)</label>
    <input id="in-hip" type="number" value="95">
    <button class="go" data-action="calculate">Hesapla</button>
  </div>

  <div class="card">
    <div id="out" class="muted">Sonuçlar burada görünecek. "Hesapla"ya bas.</div>
  </div>

  <!-- Tek giriş noktası. Geri kalan her şey import edilir. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
